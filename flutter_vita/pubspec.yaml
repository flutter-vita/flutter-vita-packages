name: flutter_vita
description: Helper for PS Vita support in Flutter apps built with the flutter-vita tool. Pad navigation, rear touch, pixel ratio, clocks, and a PS Vita check.
homepage: https://github.com/flutter-vita/flutter-vita
version: 0.1.1
repository: https://github.com/flutter-vita/flutter-vita-packages/tree/master/flutter_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita-packages/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  vita_file_browser: ^0.1.0
