name: flutter_vita
description: Set up a Flutter app for the PlayStation Vita from one call, with pad navigation, a cursor, the rear-panel trackpad, layout density and fallbacks for plugins the console has no side for.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita-packages/tree/master/flutter_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita-packages/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  vita_file_browser:
    path: ../vita_file_browser
